version: "3.8"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-topics-creator:
    image: confluentinc/cp-kafka:7.5.1
    depends_on:
      - kafka
    entrypoint: >
      sh -c "
      echo 'Waiting for Kafka to be ready...';
      sleep 10;
      kafka-topics --create --topic test --bootstrap-server kafka:9092 --partitions 3 --replication-factor 1;
      "
  redpanda:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: redpanda
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # The Kafka cluster you want to connect to
      KAFKA_BROKERS: "kafka:9092"

    # If you want schema registry or other integrations later, you can add:
    # SCHEMAREGISTRY_URL: "http://schema-registry:8081"

    depends_on:
      - kafka

  producer:
    build:
      context: ./producer
    depends_on:
      - kafka
    restart: unless-stopped
    entrypoint: >
      sh -c "
      sleep 10 &&
      /producer
      -broker kafka:9092
      -topic test
      -interval 500
      -num-partitions 3
      -mode payments
      "

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-storage:/var/lib/grafana
      - type: bind
        source: ./grafana/grafana-provisioning/
        target: /etc/grafana/provisioning/
        read_only: false
      - type: bind
        source: ./grafana/plugins
        target: /var/lib/grafana/plugins
        read_only: false
    depends_on:
      - kafka
    restart: unless-stopped

volumes:
  grafana-storage:
